[project]
name = "agent-smith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=3.2.4",
    "flake8>=7.3.0",
    "mcp>=1.22.0",
    "mypy>=1.20.2",
    "typer>=0.25.1",
]

[project.scripts]
sandbox = "cli.sandbox:app"
agent_mbpp = "cli.agent_mbpp:app"
agent_swebench = "cli.agent_swebench:app"
mcp_server = "cli.mcp_server:app"

[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = "mcp_sys.server.*"
ignore_missing_imports = true